name: Sync Publications from ORCID

on:
  schedule:
    - cron: "0 6 * * 1" # Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Add missing journal articles from ORCID
        run: python bin/sync_orcid_publications.py

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
      - name: Commit new publications if needed
        run: |
          git add _bibliography/papers.bib
          git diff --staged --quiet || (
            git commit -m "Sync publications from ORCID"
            git push
          )
